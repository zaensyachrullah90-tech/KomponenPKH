<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Database Komponen PKH Kalsel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #020617; background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a); font-family: 'Inter', sans-serif; color: #f8fafc; overflow: hidden; }
    .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }
    .table-row-hover:hover { background: rgba(99, 102, 241, 0.15); }
    .sticky-col { position: sticky; left: 0; background: #0b0f19; z-index: 20; border-right: 1px solid rgba(255,255,255,0.1); }
    .sticky-header-col { position: sticky; left: 0; background: #020617; z-index: 30; border-right: 1px solid rgba(255,255,255,0.1); }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .modal-animate { animation: fadeIn 0.2s ease-out forwards; }
    
    /* Pengaturan Cetak PDF Presisi */
    @media print { 
      body * { visibility: hidden; } 
      #rekap-print-area, #rekap-print-area * { visibility: visible; } 
      #rekap-print-area { position: absolute; left: 0; top: 0; width: 100%; color: black; background: white; border: none; box-shadow: none; padding: 0; } 
      .no-print { display: none !important; } 
      .print-title { display: block !important; text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 20px; color: black; text-transform: uppercase; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid black !important; padding: 8px !important; color: black !important; background: white !important; }
      th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] relative">

  <div id="initial-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#020617]">
    <div id="spinner-icon" class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <h2 id="loading-text" class="text-indigo-400 font-bold tracking-widest text-sm animate-pulse uppercase">Menghubungkan Database...</h2>
  </div>

  <div id="root" class="flex-1 overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // URL API TERBARU BAPAK SUDAH TERTANAM DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbydPr9lg_gNjgbDJOFCZEw9IayHu5f1cXq6njZ7FUI5T7V_RmzOFKsoWyaVk3J4lQ/exec";
    const komponenKPM = ['BUMIL', 'AUD', 'SD', 'SMP', 'SMA', 'LANSIA', 'DISABILITAS'];

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPin, setAdminPin] = useState("");
      
      const [filterKabupaten, setFilterKabupaten] = useState("Semua");
      const [searchTerm, setSearchTerm] = useState("");
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
      
      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10); 

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editFormData, setEditFormData] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const [isRekapOpen, setIsRekapOpen] = useState(false);
      const [rekapMetrics, setRekapMetrics] = useState([...komponenKPM]);

      const periodeLaporan = useMemo(() => {
        const bulanIndo = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];
        const d = new Date();
        return `${bulanIndo[d.getMonth()]} ${d.getFullYear()}`;
      }, []);

      // SISTEM FETCH ANTI-STUCK (CERDAS)
      useEffect(() => {
        fetch(API_URL)
          .then(res => {
            const contentType = res.headers.get("content-type");
            // Jika Google memblokir karena salah pengaturan deploy (biasanya mengirim halaman HTML Login)
            if (contentType && contentType.includes("text/html")) {
              throw new Error("BLOCKED_BY_GOOGLE");
            }
            return res.json();
          })
          .then(resData => { 
            setData(resData); 
            setLoading(false); 
            const loader = document.getElementById("initial-loader");
            if(loader) loader.style.display = "none"; 
          })
          .catch(err => { 
            // JIKA GAGAL/STUCK, TAMPILKAN KOTAK MERAH INI
            const loader = document.getElementById("initial-loader");
            if(loader) {
              document.getElementById("spinner-icon").style.display = "none";
              document.getElementById("loading-text").style.display = "none";
              loader.innerHTML = `
                <div style="background:#7f1d1d; padding:20px; border-radius:12px; text-align:center; max-width:85%; border:1px solid #fca5a5;">
                  <h3 style="color:white; font-weight:900; font-size:18px; margin-bottom:10px;">❌ AKSES DATABASE DITOLAK</h3>
                  <p style="color:#fecaca; font-size:13px; line-height:1.5;">Google memblokir akses ke GitHub.</p>
                  <p style="color:#fecaca; font-size:13px; line-height:1.5; margin-top:10px;">Buka Apps Script Bapak, buat <b>Penerapan Baru (New Deployment)</b>, lalu WAJIB atur:<br><br>1. Execute as: <b>Me (Saya)</b><br>2. Who has access: <b>Anyone (Siapa Saja)</b></p>
                  <p style="color:#fecaca; font-size:11px; margin-top:15px; font-style:italic;">*Lalu ganti URL API di file index.html dengan URL yang baru</p>
                </div>
              `;
            }
          });
      }, []);

      const tableHeaders = useMemo(() => data.length === 0 ? [] : Object.keys(data[0]), [data]);
      const listKabupaten = useMemo(() => ["Semua", ...new Set(data.map(item => item['KABUPATEN/KOTA']).filter(Boolean))], [data]);

      const processedData = useMemo(() => {
        let filtered = data.filter(item => {
          const matchKab = filterKabupaten === "Semua" || item['KABUPATEN/KOTA'] === filterKabupaten;
          const matchSearch = Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm.toLowerCase()));
          return matchKab && matchSearch;
        });
        if (sortConfig.key !== null) {
          filtered.sort((a, b) => {
            let valA = a[sortConfig.key] ?? ""; let valB = b[sortConfig.key] ?? "";
            const isNum = !isNaN(valA) && !isNaN(valB) && valA !== "" && valB !== "";
            if (isNum) return sortConfig.direction === 'asc' ? Number(valA) - Number(valB) : Number(valB) - Number(valA);
            return sortConfig.direction === 'asc' ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
          });
        }
        return filtered;
      }, [data, filterKabupaten, searchTerm, sortConfig]);

      useEffect(() => { setCurrentPage(1); }, [filterKabupaten, searchTerm, sortConfig, itemsPerPage]);
      const totalPages = Math.ceil(processedData.length / itemsPerPage) || 1;
      const paginatedData = processedData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
      const handleSort = (key) => setSortConfig({ key, direction: sortConfig.key === key && sortConfig.direction === 'asc' ? 'desc' : 'asc' });

      const dataRekap13Kab = useMemo(() => {
        const kabMap = {};
        data.forEach(row => {
          const kab = row['KABUPATEN/KOTA'] || "TIDAK DIKETAHUI";
          if(!kabMap[kab]) { kabMap[kab] = { name: kab, totalSDM: 0 }; komponenKPM.forEach(k => kabMap[kab][k] = 0); }
          kabMap[kab].totalSDM += 1;
          komponenKPM.forEach(k => { kabMap[kab][k] += (parseInt(row[k]) || 0); });
        });
        return Object.values(kabMap).sort((a, b) => a.name.localeCompare(b.name));
      }, [data]);

      const executeAPI = (payload, successMsg) => {
        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.text())
        .then(res => { if(res.includes("SUKSES")) { alert(successMsg); window.location.reload(); } else { alert(res); setIsSubmitting(false); } })
        .catch(err => { alert("Gagal kirim data."); setIsSubmitting(false); });
      };

      const handleDelete = (kabupaten, namaTarget) => {
        if(!isAdmin) return alert("PIN Admin diperlukan.");
        if(!confirm(`Hapus permanen: ${namaTarget}?`)) return;
        setLoading(true);
        executeAPI({ action: "delete", kabupaten, namaTarget, pin: adminPin }, "Data Terhapus!");
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        executeAPI({ action: "update", kabupaten: editFormData['KABUPATEN/KOTA'], namaTarget: editFormData['NAMA'], formData: editFormData, pin: adminPin }, "Data Berhasil Diperbarui!");
      };

      const handleLoginAdmin = () => {
        if (isAdmin) { setIsAdmin(false); setAdminPin(""); alert("Logout Berhasil."); } 
        else { const pin = prompt("Masukkan PIN Admin:"); if (pin) { setAdminPin(pin); setIsAdmin(true); alert("Sistem Admin Aktif."); } }
      };

      const exportToCSV = () => {
        if (processedData.length === 0) return alert("Data kosong!");
        const headers = Object.keys(processedData[0]);
        let csvRows = [`"JUMLAH KOMPONEN KPM PKH SEKALIMANTAN SELATAN BULAN ${periodeLaporan}"`, "", headers.join(',')];
        processedData.forEach(row => { csvRows.push(headers.map(h => `"${String(row[h] == null ? "" : row[h]).replace(/"/g, '""')}"`).join(',')); });
        const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Laporan_SDM_PKH_${filterKabupaten}.csv`; link.click();
      };

      if (loading) return null; // Layar loading statis akan tetap tampil jika loading=true

      return (
        <div className="flex flex-col h-full w-full mx-auto relative md:p-4 p-2 bg-[#020617] pb-20 md:pb-4">
          
          {/* ======================================================== */}
          {/* MODAL REKAPITULASI 13 KABUPATEN DENGAN CHECKBOX KOMPONEN */}
          {/* ======================================================== */}
          {isRekapOpen && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/90 backdrop-blur-md p-2 md:p-4">
              <div id="rekap-print-area" className="glass-panel w-full h-full md:h-auto md:max-w-6xl md:max-h-[90vh] rounded-xl flex flex-col modal-animate bg-[#0f172a]">
                
                {/* JUDUL PDF DINAMIS */}
                <div className="hidden print-title">
                  JUMLAH KOMPONEN KPM PKH SEKALIMANTAN SELATAN BULAN {periodeLaporan}
                </div>

                <div className="p-4 border-b border-white/10 flex justify-between items-center bg-emerald-900/30 rounded-t-xl no-print">
                  <h2 className="text-sm md:text-xl font-black text-emerald-400 uppercase">REKAPITULASI 13 KABUPATEN</h2>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="bg-rose-600 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-lg text-xs font-bold shadow transition hover:bg-rose-500">PDF</button>
                    <button onClick={() => setIsRekapOpen(false)} className="bg-slate-800 text-white px-3 py-1.5 md:py-2 rounded-lg text-xs font-bold transition hover:bg-slate-700">TUTUP</button>
                  </div>
                </div>

                {/* CHECKBOX PILIH KOMPONEN */}
                <div className="p-3 bg-[#0b0f19] border-b border-white/5 no-print overflow-x-auto custom-scrollbar">
                   <div className="flex gap-2 items-center min-w-max">
                    <span className="text-[10px] md:text-xs font-bold text-slate-400 uppercase bg-slate-800 px-2 py-1 rounded">Filter Komponen:</span>
                    {komponenKPM.map(m => (
                      <label key={m} className="flex items-center gap-1.5 cursor-pointer bg-slate-800/50 px-2 md:px-3 py-1.5 rounded border border-slate-700 hover:border-emerald-500 transition">
                        <input 
                          type="checkbox" 
                          checked={rekapMetrics.includes(m)} 
                          onChange={() => setRekapMetrics(prev => prev.includes(m) ? prev.filter(x => x !== m) : [...prev, m])} 
                          className="accent-emerald-500 w-3 h-3 md:w-4 md:h-4" 
                        />
                        <span className="text-[10px] md:text-xs font-bold text-slate-200">{m}</span>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="flex-1 overflow-auto custom-scrollbar p-2 md:p-4 bg-white md:bg-transparent">
                  <table className="w-full text-left border-collapse min-w-max text-black md:text-white text-xs md:text-sm">
                    <thead className="bg-slate-200 md:bg-[#0b0f19] sticky top-0 border-b border-slate-300 md:border-slate-700 z-10">
                      <tr>
                        <th className="px-3 py-3 md:px-4 md:py-3 uppercase font-black">Kabupaten / Kota</th>
                        <th className="px-3 py-3 md:px-4 md:py-3 uppercase font-black text-center">Total SDM</th>
                        {rekapMetrics.map(m => <th key={m} className="px-3 py-3 md:px-4 md:py-3 uppercase font-black text-center">{m}</th>)}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-300 md:divide-slate-800">
                      {dataRekap13Kab.map(kab => (
                        <tr key={kab.name} className="hover:bg-slate-100 md:hover:bg-slate-800/50">
                          <td className="px-3 py-2 md:px-4 md:py-3 font-bold md:text-slate-300">{kab.name}</td>
                          <td className="px-3 py-2 md:px-4 md:py-3 text-center font-black text-emerald-600 md:text-emerald-400 bg-emerald-50 md:bg-emerald-900/10">{kab.totalSDM}</td>
                          {rekapMetrics.map(m => <td key={m} className="px-3 py-2 md:px-4 md:py-3 text-center md:text-slate-300 font-mono">{kab[m]}</td>)}
                        </tr>
                      ))}
                      <tr className="bg-slate-300 md:bg-slate-800 font-black">
                        <td className="px-3 py-3 md:px-4 md:py-3 uppercase text-black md:text-white">GRAND TOTAL</td>
                        <td className="px-3 py-3 md:px-4 md:py-3 text-center text-emerald-700 md:text-emerald-400">{dataRekap13Kab.reduce((sum, k) => sum + k.totalSDM, 0)}</td>
                        {rekapMetrics.map(m => <td key={m} className="px-3 py-3 md:px-4 md:py-3 text-center text-black md:text-white font-mono">{dataRekap13Kab.reduce((sum, k) => sum + k[m], 0)}</td>)}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL EDIT DATA PER BARIS                                */}
          {/* ======================================================== */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-2 no-print">
              <div className="glass-panel w-full max-w-4xl max-h-[95vh] rounded-xl flex flex-col bg-[#0f172a]">
                <div className="p-4 border-b border-white/10 flex justify-between items-center bg-indigo-900/40 rounded-t-xl">
                  <h2 className="text-lg font-bold text-indigo-300">Edit Data</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 text-2xl px-2 hover:text-white">&times;</button>
                </div>
                <form onSubmit={handleSaveEdit} className="p-4 overflow-auto custom-scrollbar flex-1 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    {tableHeaders.map(header => {
                      const isLocked = (header.toUpperCase() === "NAMA") || (!isAdmin && !komponenKPM.includes(header.toUpperCase()));
                      return (
                        <div key={header} className="flex flex-col space-y-1">
                          <label className="text-[10px] font-semibold text-slate-400 uppercase flex justify-between">
                            {header} {isLocked && <span className="text-orange-500/70">🔒</span>}
                          </label>
                          <input 
                            type="text" 
                            value={editFormData[header] || ""} 
                            onChange={(e) => setEditFormData({...editFormData, [header]: e.target.value})} 
                            disabled={isLocked} 
                            className={`w-full px-3 py-2 rounded-lg text-xs border focus:outline-none transition ${isLocked ? "bg-slate-800 border-slate-700 text-slate-500" : "bg-slate-900 border-slate-500 text-white focus:ring-indigo-500 focus:border-indigo-500"}`} 
                          />
                        </div>
                      )
                    })}
                    <div className="col-span-full mt-4 flex justify-end gap-2">
                      <button type="submit" disabled={isSubmitting} className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg font-bold text-xs md:text-sm shadow-lg transition">
                        {isSubmitting ? "MENYIMPAN..." : "SIMPAN DATA"}
                      </button>
                    </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* HEADER APLIKASI (JUDUL & KABUPATEN)                      */}
          {/* ======================================================== */}
          <div className="glass-panel rounded-xl p-3 md:p-4 mb-2 shrink-0 flex flex-col md:flex-row justify-between items-center gap-3 no-print">
            <div className="w-full md:w-auto">
              <h1 className="text-[13px] sm:text-lg md:text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 uppercase tracking-tighter">
                DATABASE KOMPONEN PKH KALIMANTAN SELATAN
              </h1>
              <div className="flex gap-2 mt-1">
                <button onClick={handleLoginAdmin} className={`px-2 py-0.5 rounded text-[9px] md:text-[10px] font-black uppercase tracking-wider transition ${isAdmin ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500' : 'bg-slate-800 text-slate-400 border border-slate-600 hover:bg-slate-700'}`}>
                  {isAdmin ? '👑 ADMIN AKTIF' : '👤 USER BIASA'}
                </button>
              </div>
            </div>
            <div className="flex gap-2 overflow-x-auto custom-scrollbar w-full md:w-auto px-1 pb-1">
              {listKabupaten.map(kab => (
                <button key={kab} onClick={() => setFilterKabupaten(kab)} c

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PKH Mobile Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Desain Dasar */
    body { background: #020617; background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a); font-family: 'Inter', 'Segoe UI', sans-serif; color: #f8fafc; overflow: hidden; }
    .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    
    /* Scrollbar Halus */
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
    
    /* Tabel Interaktif */
    .table-row-hover:hover { background: rgba(99, 102, 241, 0.15); }
    .sticky-col { position: sticky; left: 0; background: #0b0f19; z-index: 20; border-right: 1px solid rgba(255,255,255,0.1); }
    .sticky-header-col { position: sticky; left: 0; background: #020617; z-index: 30; border-right: 1px solid rgba(255,255,255,0.1); }
    
    /* Animasi */
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .modal-animate { animation: fadeIn 0.2s ease-out forwards; }
    
    /* Aturan Cetak PDF Rekap */
    @media print {
      body * { visibility: hidden; }
      #rekap-print-area, #rekap-print-area * { visibility: visible; }
      #rekap-print-area { position: absolute; left: 0; top: 0; width: 100%; color: black; background: white; border: none; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] relative">

  <div id="initial-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#020617]">
    <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <h2 class="text-indigo-400 font-bold tracking-widest text-sm animate-pulse">MENYIAPKAN SISTEM...</h2>
  </div>

  <div id="root" class="flex-1 overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ====================================================================
    // ⚠️ MASUKKAN URL WEB APP ANDA DI BAWAH INI (JANGAN HAPUS TANDA KUTIP)
    // ====================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwstmXAMcbx0VIvxTdflkGTkGc10eINhKz6hOvbmgsMyzdK3eW7pYEC1b95xPIVsMMA/exec";

    const komponenKPM = ['BUMIL', 'AUD', 'SD', 'SMP', 'SMA', 'LANSIA', 'DISABILITAS'];

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPin, setAdminPin] = useState("");

      const [filterKabupaten, setFilterKabupaten] = useState("Semua");
      const [searchTerm, setSearchTerm] = useState("");
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 10;

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editFormData, setEditFormData] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const [isRekapOpen, setIsRekapOpen] = useState(false);
      const [rekapMetrics, setRekapMetrics] = useState([...komponenKPM]);

      // Hilangkan Pre-loader bawaan HTML setelah React siap
      useEffect(() => {
        const loader = document.getElementById("initial-loader");
        if(loader) loader.style.display = "none";
      }, []);

      // Fetch Data API
      useEffect(() => {
        fetch(API_URL)
          .then(res => res.json())
          .then(resData => { setData(resData); setLoading(false); })
          .catch(err => { alert("Gagal mengambil data. Pastikan URL API sudah benar."); setLoading(false); });
      }, []);

      const tableHeaders = useMemo(() => data.length === 0 ? [] : Object.keys(data[0]), [data]);
      const listKabupaten = useMemo(() => ["Semua", ...new Set(data.map(item => item['KABUPATEN/KOTA']).filter(Boolean))], [data]);

      // Filter Data Tabel Utama
      const processedData = useMemo(() => {
        let filtered = data.filter(item => {
          const matchKab = filterKabupaten === "Semua" || item['KABUPATEN/KOTA'] === filterKabupaten;
          const matchSearch = Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm.toLowerCase()));
          return matchKab && matchSearch;
        });
        if (sortConfig.key !== null) {
          filtered.sort((a, b) => {
            let valA = a[sortConfig.key] ?? ""; let valB = b[sortConfig.key] ?? "";
            const isNum = !isNaN(valA) && !isNaN(valB) && valA !== "" && valB !== "";
            if (isNum) return sortConfig.direction === 'asc' ? Number(valA) - Number(valB) : Number(valB) - Number(valA);
            return sortConfig.direction === 'asc' ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
          });
        }
        return filtered;
      }, [data, filterKabupaten, searchTerm, sortConfig]);

      useEffect(() => { setCurrentPage(1); }, [filterKabupaten, searchTerm, sortConfig]);
      const totalPages = Math.ceil(processedData.length / itemsPerPage) || 1;
      const paginatedData = processedData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
      const handleSort = (key) => setSortConfig({ key, direction: sortConfig.key === key && sortConfig.direction === 'asc' ? 'desc' : 'asc' });

      // Kalkulasi Rekapitulasi (Menu Besar)
      const dataRekap13Kab = useMemo(() => {
        const kabMap = {};
        data.forEach(row => {
          const kab = row['KABUPATEN/KOTA'] || "TIDAK DIKETAHUI";
          if(!kabMap[kab]) { kabMap[kab] = { name: kab, totalSDM: 0 }; komponenKPM.forEach(k => kabMap[kab][k] = 0); }
          kabMap[kab].totalSDM += 1;
          komponenKPM.forEach(k => { kabMap[kab][k] += (parseInt(row[k]) || 0); });
        });
        return Object.values(kabMap).sort((a, b) => a.name.localeCompare(b.name));
      }, [data]);

      // Eksekusi API
      const executeAPI = (payload, successMsg) => {
        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.text())
        .then(res => {
          if(res.includes("SUKSES")) { alert(successMsg); window.location.reload(); } 
          else { alert(res); setIsSubmitting(false); setLoading(false); }
        }).catch(err => { alert("Koneksi ke server gagal."); setIsSubmitting(false); setLoading(false); });
      };

      const handleDelete = (kabupaten, namaTarget) => {
        if(!isAdmin) return alert("Anda harus login sebagai Admin untuk menghapus.");
        if(!confirm(`PERINGATAN!\nAnda yakin menghapus data: ${namaTarget} ?`)) return;
        setLoading(true);
        executeAPI({ action: "delete", kabupaten, namaTarget, pin: adminPin }, "Data berhasil dihapus!");
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        if(!confirm("Simpan perubahan data ini?")) return;
        setIsSubmitting(true);
        executeAPI({ action: "update", kabupaten: editFormData['KABUPATEN/KOTA'], namaTarget: editFormData['NAMA'], formData: editFormData, pin: adminPin }, "Data berhasil diperbarui!");
      };

      const handleLoginAdmin = () => {
        if (isAdmin) { setIsAdmin(false); setAdminPin(""); alert("Logout berhasil."); } 
        else { const pin = prompt("Masukkan PIN Rahasia Admin:"); if (pin) { setAdminPin(pin); setIsAdmin(true); alert("Sistem Admin Terbuka."); } }
      };

      const exportToCSV = () => {
        if (processedData.length === 0) return alert("Data kosong!");
        const headers = Object.keys(processedData[0]);
        let csvRows = [headers.join(',')];
        processedData.forEach(row => { csvRows.push(headers.map(h => `"${String(row[h] == null ? "" : row[h]).replace(/"/g, '""')}"`).join(',')); });
        const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Data_SDM_${filterKabupaten}.csv`; link.click();
      };

      if (loading) return (
        <div className="flex h-screen flex-col items-center justify-center space-y-4">
          <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
          <div className="text-sm font-bold text-indigo-400 animate-pulse uppercase">Mengambil Data Server...</div>
        </div>
      );

      return (
        <div className="flex flex-col h-full w-full mx-auto relative md:p-4 p-2 bg-[#020617]">
          
          {/* ========================================= */}
          {/* MODAL REKAPITULASI (POP-UP DASHBOARD)     */}
          {/* ========================================= */}
          {isRekapOpen && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/90 backdrop-blur-md p-2 md:p-4">
              <div id="rekap-print-area" className="glass-panel w-full h-full md:h-auto md:max-w-6xl md:max-h-[90vh] rounded-xl flex flex-col modal-animate bg-[#0f172a]">
                
                {/* Header Rekap */}
                <div className="p-4 border-b border-white/10 flex justify-between items-start md:items-center bg-emerald-900/30 rounded-t-xl no-print flex-col md:flex-row gap-3">
                  <div>
                    <h2 className="text-xl md:text-2xl font-black text-emerald-400 tracking-wider">REKAPITULASI 13 KABUPATEN</h2>
                    <p className="text-xs text-emerald-200/70">Akumulasi komponen PKH Kalimantan Selatan</p>
                  </div>
                  <div className="flex gap-2 items-center self-end md:self-auto">
                    <button onClick={() => window.print()} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg">Cetak PDF</button>
                    <button onClick={() => setIsRekapOpen(false)} className="bg-slate-800 hover:bg-slate-700 text-white rounded-lg px-3 py-2 font-bold text-sm">Tutup</button>
                  </div>
                </div>

                {/* Filter Komponen Rekap */}
                <div className="p-3 bg-[#0b0f19] border-b border-white/5 no-print overflow-x-auto custom-scrollbar">
                   <div className="flex gap-2 items-center min-w-max">
                    <span className="text-[10px] md:text-xs font-bold text-slate-400 uppercase bg-slate-800 px-2 py-1 rounded">Filter:</span>
                    {komponenKPM.map(m => (
                      <label key={m} className="flex items-center gap-1.5 cursor-pointer bg-slate-800/50 px-2 md:px-3 py-1.5 rounded border border-slate-700">
                        <input type="checkbox" checked={rekapMetrics.includes(m)} onChange={() => setRekapMetrics(prev => prev.includes(m) ? prev.filter(x => x !== m) : [...prev, m])} className="accent-emerald-500 w-3 h-3 md:w-4 md:h-4" />
                        <span className="text-[10px] md:text-xs font-bold text-slate-200">{m}</span>
                      </label>
                    ))}
                  </div>
                </div>

                {/* Tabel Rekap */}
                <div className="flex-1 overflow-auto custom-scrollbar p-0 md:p-4 bg-white md:bg-transparent">
                  <table className="w-full text-left border-collapse min-w-max text-black md:text-white text-xs md:text-sm">
                    <thead className="bg-slate-200 md:bg-[#0b0f19] sticky top-0 border-b border-slate-300 md:border-slate-700 z-10">
                      <tr>
                        <th className="px-3 py-3 md:px-6 md:py-4 font-black uppercase">Kabupaten/Kota</th>
                        <th className="px-3 py-3 md:px-6 md:py-4 font-black uppercase text-center">Total SDM</th>
                        {rekapMetrics.map(m => <th key={m} className="px-3 py-3 md:px-6 md:py-4 font-black uppercase text-center">{m}</th>)}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-300 md:divide-slate-800">
                      {dataRekap13Kab.map(kab => (
                        <tr key={kab.name} className="hover:bg-slate-100 md:hover:bg-slate-800/50">
                          <td className="px-3 py-3 md:px-6 md:py-4 font-bold md:text-slate-300">{kab.name}</td>
                          <td className="px-3 py-3 md:px-6 md:py-4 text-center font-black text-emerald-600 md:text-emerald-400 bg-emerald-50 md:bg-emerald-900/10">{kab.totalSDM}</td>
                          {rekapMetrics.map(m => <td key={m} className="px-3 py-3 md:px-6 md:py-4 text-center md:text-slate-400 font-mono">{kab[m].toLocaleString('id-ID')}</td>)}
                        </tr>
                      ))}
                      <tr className="bg-slate-300 md:bg-slate-800 font-black">
                        <td className="px-3 py-4 md:px-6 md:py-4 uppercase text-black md:text-white">GRAND TOTAL</td>
                        <td className="px-3 py-4 md:px-6 md:py-4 text-center text-emerald-700 md:text-emerald-400">{dataRekap13Kab.reduce((sum, k) => sum + k.totalSDM, 0)}</td>
                        {rekapMetrics.map(m => <td key={m} className="px-3 py-4 md:px-6 md:py-4 text-center text-black md:text-white font-mono">{dataRekap13Kab.reduce((sum, k) => sum + k[m], 0).toLocaleString('id-ID')}</td>)}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ========================================= */}
          {/* MODAL EDIT DATA INDIVIDU                    */}
          {/* ========================================= */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-2 md:p-4 no-print">
              <div className="glass-panel w-full max-w-4xl max-h-[95vh] rounded-xl flex flex-col modal-animate bg-[#0f172a]">
                <div className="p-4 border-b border-white/10 flex justify-between items-center bg-indigo-900/40 rounded-t-xl">
                  <div>
                    <h2 className="text-lg md:text-xl font-bold text-indigo-300">Edit Data SDM</h2>
                    {!isAdmin && <p className="text-[10px] md:text-xs text-orange-400 mt-1">User: Hanya mengedit angka komponen.</p>}
                  </div>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white text-2xl px-2">&times;</button>
                </div>
                <form onSubmit={handleSaveEdit} className="p-4 overflow-auto custom-scrollbar flex-1">
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    {tableHeaders.map(header => {
                      const disabled = (header.toUpperCase() === "NAMA") || (!isAdmin && !komponenKPM.includes(header.toUpperCase()));
                      return (
                        <div key={header} className="flex flex-col space-y-1">
                          <label className="text-[10px] md:text-xs font-semibold text-slate-400 uppercase tracking-wide flex justify-between">
                            {header} {disabled && <span className="text-orange-500/70 text-[9px]">🔒 Locked</span>}
                          </label>
                          <input 
                            type="text" value={editFormData[header] || ""} onChange={(e) => setEditFormData({...editFormData, [header]: e.target.value})}
                            disabled={disabled}
                            className={`w-full px-3 py-2 rounded-lg text-xs md:text-sm border focus:outline-none transition-all ${disabled ? "bg-slate-800/50 border-slate-700/50 text-slate-500" : "bg-slate-900 border-slate-500 text-white focus:ring-2 focus:ring-indigo-500"}`}
                          />
                        </div>
                      )
                    })}
                  </div>
                  <div className="mt-6 flex justify-end gap-2 pt-4 border-t border-white/10">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs md:text-sm font-bold">Batal</button>
                    <button type="submit" disabled={isSubmitting} className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm font-bold">
                      {isSubmitting ? "Menyimpan..." : "Simpan"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================= */}
          {/* HEADER UTAMA & FILTER KABUPATEN           */}
          {/* ========================================= */}
          <div className="glass-panel rounded-xl p-3 md:p-4 mb-2 md:mb-3 shrink-0 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 md:gap-4 no-print">
            <div className="w-full md:w-auto flex justify-between items-center">
              <div>
                <h1 className="text-lg md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">DATABASE PKH</h1>
                <div className="flex items-center gap-2 mt-1 cursor-pointer" onClick={handleLoginAdmin}>
                  <span className={`px-2 py-0.5 rounded text-[9px] md:text-[10px] font-black uppercase tracking-wider ${isAdmin ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500' : 'bg-slate-800 text-slate-400 border border-slate-600'}`}>
                    {isAdmin ? '👑 ADMIN AKTIF' : '👤 USER BIASA'}
                  </span>
                </div>
              </div>
            </div>
            
            {/* Filter Kabupaten (Bisa di-scroll horizontal di HP) */}
            <div className="flex gap-2 w-full md:w-auto overflow-x-auto custom-scrollbar pb-1 md:pb-0 px-1">
              {listKabupaten.map(kab => (
                <button key={kab} onClick={() => setFilterKabupaten(kab)} className={`px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-[10px] md:text-xs font-bold transition-all whitespace-nowrap border ${filterKabupaten === kab ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800/60 border-slate-600 text-slate-400'}`}>{kab}</button>
              ))}
            </div>
          </div>

          {/* ========================================= */}
          {/* SEARCH & DESKTOP ACTION BAR               */}
          {/* ========================================= */}
          <div className="glass-panel rounded-xl p-2 md:p-3 mb-2 md:mb-3 shrink-0 flex flex-col md:flex-row gap-2 md:gap-3 items-center justify-between no-print">
            <input type="text" placeholder="🔍 Cari Nama, NIP, Jabatan..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full md:w-1/3 bg-slate-900/60 border border-slate-600 text-white text-xs md:text-sm px-3 md:px-4 py-2 md:py-2.5 rounded-lg focus:outline-none focus:border-indigo-400 transition" />
            
            <div className="flex gap-2 md:gap-4 items-center w-full md:w-auto justify-between overflow-x-auto">
              <div className="flex items-center gap-1 md:gap-2 bg-slate-900/80 rounded-lg p-1 border border-slate-700">
                <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="px-2 py-1 md:px-3 md:py-1 bg-slate-800 text-white rounded text-[10px] md:text-sm disabled:opacity-30">◀</button>
                <span className="text-[10px] md:text-xs font-bold px-1 md:px-2 text-indigo-300 whitespace-nowrap">Hal {currentPage} / {totalPages}</span>
                <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="px-2 py-1 md:px-3 md:py-1 bg-slate-800 text-white rounded text-[10px] md:text-sm disabled:opacity-30">▶</button>
              </div>
              
              {/* Action Buttons (Disembunyikan di HP, Muncul di Desktop) */}
              <div className="hidden md:flex gap-2">
                <button onClick={() => setIsRekapOpen(true)} className="flex items-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 border border-emerald-400 text-white px-4 py-1.5 rounded-lg text-xs font-black shadow-lg">
                  📊 REKAP KABUPATEN
                </button>
                <button onClick={exportToCSV} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 border border-indigo-400 text-white px-4 py-1.5 rounded-lg text-xs font-bold">CSV</button>
              </div>
            </div>
          </div>

          {/* ========================================= */}
          {/* TABEL DATA INDIVIDU (MOBILE & DESKTOP)    */}
          {/* ========================================= */}
          {/* Padding bottom 16 ditambahkan agar tabel tidak tertutup Bottom Bar di HP */}
          <div className="flex-1 glass-panel rounded-xl overflow-hidden flex flex-col relative border border-slate-700/50 mb-16 md:mb-0 no-print">
            <div className="overflow-auto custom-scrollbar flex-1 relative w-full h-full">
              <table className="w-full min-w-[1200px] text-xs md:text-sm text-left border-collapse">
                <thead className="uppercase text-slate-400 bg-[#0b0f19] sticky top-0 z-20 shadow-md text-[10px] md:text-xs">
                  <tr>
                    <th className="px-3 py-3 md:px-4 md:py-4 font-bold tracking-wider sticky-header-col text-center w-24 md:w-32 border-b border-slate-700">Aksi</th>
                    {tableHeaders.map((header) => (
                      <th key={header} onClick={() => handleSort(header)} className="px-3 py-3 md:px-4 md:py-4 font-bold tracking-wider cursor-pointer hover:bg-slate-800 whitespace-nowrap border-b border-slate-700">
                        {header} <span className="text-indigo-400 font-black ml-1">{sortConfig.key === header ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-700/50">
                  {paginatedData.length > 0 ? paginatedData.map((row, idx) => (
                    <tr key={idx} className="table-row-hover bg-[#020617]/30 transition-all">
                      <td className="px-2 py-2 sticky-col text-center shadow-[2px_0_5px_rgba(0,0,0,0.3)]">
                        <div className="flex justify-center gap-1.5 md:gap-2">
                          <button onClick={() => openEditModal(row)} className="bg-indigo-600/80 hover:bg-indigo-500 text-white px-2 py-1 md:px-3 md:py-1.5 rounded text-[9px] md:text-xs font-bold">UBAH</button>
                          {isAdmin && (
                            <button onClick={() => handleDelete(row['KABUPATEN/KOTA'], row['NAMA'])} className="bg-red-600/80 hover:bg-red-500 text-white px-2 py-1 md:px-3 md:py-1.5 rounded text-[9px] md:text-xs font-bold">HAPUS</button>
                          )}
                        </div>
                      </td>
                      {tableHeaders.map(header => (
                        <td key={header} className="px-3 py-2 md:px-4 md:py-3 text-slate-300 whitespace-nowrap text-[11px] md:text-sm">
                          {row[header] === null || row[header] === "" ? <span className="text-slate-600">-</span> : row[header]}
                        </td>
                      ))}
                    </tr>
                  )) : <tr><td colSpan={tableHeaders.length + 1} className="px-6 py-12 text-center text-slate-500 text-xs">Data tidak ditemukan.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>

          {/* ========================================= */}
          {/* BOTTOM ACTION BAR (MUNCUL HANYA DI HP)    */}
          {/* ========================================= */}
          <div className="md:hidden fixed bottom-0 left-0 w-full glass-panel border-t border-slate-600 p-3 flex gap-2 justify-between items-center z-50 bg-[#0f172a]/95">
            <button onClick={() => setIsRekapOpen(true)} className="flex-1 flex justify-center items-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 text-white py-2.5 rounded-lg text-[11px] font-black shadow-lg">
              📊 REKAP 13 KABUPATEN
            </button>
            <button onClick={exportToCSV} className="flex-[0.4] flex justify-center items-center gap-2 bg-indigo-600 text-white py-2.5 rounded-lg text-[11px] font-bold">
              CSV
            </button>
          </div>
          
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>

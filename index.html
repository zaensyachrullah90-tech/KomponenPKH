<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Database Komponen PKH Kalsel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #020617; background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a); font-family: 'Inter', sans-serif; color: #f8fafc; overflow: hidden; }
    .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }
    .table-row-hover:hover { background: rgba(99, 102, 241, 0.15); }
    .sticky-col { position: sticky; left: 0; background: #0b0f19; z-index: 20; border-right: 1px solid rgba(255,255,255,0.1); }
    .sticky-header-col { position: sticky; left: 0; background: #020617; z-index: 30; border-right: 1px solid rgba(255,255,255,0.1); }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .modal-animate { animation: fadeIn 0.2s ease-out forwards; }
    @media print { body * { visibility: hidden; } #rekap-print-area, #rekap-print-area * { visibility: visible; } #rekap-print-area { position: absolute; left: 0; top: 0; width: 100%; color: black; background: white; border: none; } .no-print { display: none !important; } }
  </style>
</head>
<body class="flex flex-col h-[100dvh] relative">

  <div id="initial-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#020617]">
    <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <h2 class="text-indigo-400 font-bold tracking-widest text-sm animate-pulse uppercase">Menghubungkan Database...</h2>
    <p id="error-status" class="text-rose-500 text-[10px] mt-2 hidden text-center px-6"></p>
  </div>

  <div id="root" class="flex-1 overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // URL TERBARU ANDA SUDAH DIPASANG DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbyzPXs6sDNbmMe04Cp-eheaWUb6IwwFhrETG84t4IAQl-nGRnO7CKKmsDA20jS42Rcn/exec";
    const komponenKPM = ['BUMIL', 'AUD', 'SD', 'SMP', 'SMA', 'LANSIA', 'DISABILITAS'];

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPin, setAdminPin] = useState("");
      const [filterKabupaten, setFilterKabupaten] = useState("Semua");
      const [searchTerm, setSearchTerm] = useState("");
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10); 

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editFormData, setEditFormData] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isRekapOpen, setIsRekapOpen] = useState(false);
      const [rekapMetrics, setRekapMetrics] = useState([...komponenKPM]);

      useEffect(() => {
        const loader = document.getElementById("initial-loader");
        const errorStat = document.getElementById("error-status");
        
        fetch(API_URL + "?t=" + new Date().getTime())
          .then(res => res.json())
          .then(resData => {
            setData(resData);
            setLoading(false);
            if(loader) loader.style.display = "none";
          })
          .catch(err => {
            setLoading(false);
            if(errorStat) {
              errorStat.innerText = "Database tidak merespon. Pastikan Deployment di Apps Script sudah diatur ke 'Anyone'.";
              errorStat.style.display = "block";
            }
          });
      }, []);

      const tableHeaders = useMemo(() => data.length === 0 ? [] : Object.keys(data[0]), [data]);
      const listKabupaten = useMemo(() => ["Semua", ...new Set(data.map(item => item['KABUPATEN/KOTA']).filter(Boolean))], [data]);

      const processedData = useMemo(() => {
        let filtered = data.filter(item => {
          const matchKab = filterKabupaten === "Semua" || item['KABUPATEN/KOTA'] === filterKabupaten;
          const matchSearch = Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm.toLowerCase()));
          return matchKab && matchSearch;
        });
        if (sortConfig.key !== null) {
          filtered.sort((a, b) => {
            let valA = a[sortConfig.key] ?? ""; let valB = b[sortConfig.key] ?? "";
            const isNum = !isNaN(valA) && !isNaN(valB) && valA !== "" && valB !== "";
            if (isNum) return sortConfig.direction === 'asc' ? Number(valA) - Number(valB) : Number(valB) - Number(valA);
            return sortConfig.direction === 'asc' ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
          });
        }
        return filtered;
      }, [data, filterKabupaten, searchTerm, sortConfig]);

      useEffect(() => { setCurrentPage(1); }, [filterKabupaten, searchTerm, sortConfig, itemsPerPage]);
      const totalPages = Math.ceil(processedData.length / itemsPerPage) || 1;
      const paginatedData = processedData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
      const handleSort = (key) => setSortConfig({ key, direction: sortConfig.key === key && sortConfig.direction === 'asc' ? 'desc' : 'asc' });

      const dataRekap13Kab = useMemo(() => {
        const kabMap = {};
        data.forEach(row => {
          const kab = row['KABUPATEN/KOTA'] || "TIDAK DIKETAHUI";
          if(!kabMap[kab]) { kabMap[kab] = { name: kab, totalSDM: 0 }; komponenKPM.forEach(k => kabMap[kab][k] = 0); }
          kabMap[kab].totalSDM += 1;
          komponenKPM.forEach(k => { kabMap[kab][k] += (parseInt(row[k]) || 0); });
        });
        return Object.values(kabMap).sort((a, b) => a.name.localeCompare(b.name));
      }, [data]);

      const executeAPI = (payload, successMsg) => {
        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.text())
        .then(res => { if(res.includes("SUKSES")) { alert(successMsg); window.location.reload(); } else { alert(res); setIsSubmitting(false); } })
        .catch(err => { alert("Gagal kirim data."); setIsSubmitting(false); });
      };

      const handleDelete = (kabupaten, namaTarget) => {
        if(!isAdmin) return alert("PIN Admin diperlukan.");
        if(!confirm(`Hapus: ${namaTarget}?`)) return;
        setLoading(true);
        executeAPI({ action: "delete", kabupaten, namaTarget, pin: adminPin }, "Data Terhapus!");
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        executeAPI({ action: "update", kabupaten: editFormData['KABUPATEN/KOTA'], namaTarget: editFormData['NAMA'], formData: editFormData, pin: adminPin }, "Data Berhasil Diperbarui!");
      };

      const handleLoginAdmin = () => {
        if (isAdmin) { setIsAdmin(false); setAdminPin(""); alert("Logout Berhasil."); } 
        else { const pin = prompt("Masukkan PIN Admin:"); if (pin) { setAdminPin(pin); setIsAdmin(true); alert("Sistem Admin Aktif."); } }
      };

      const exportToCSV = () => {
        const bulanIndo = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];
        const d = new Date();
        const periode = `${bulanIndo[d.getMonth()]} ${d.getFullYear()}`;
        const headers = Object.keys(processedData[0]);
        let csvRows = [`"JUMLAH KOMPONEN KPM PKH SEKALIMANTAN SELATAN BULAN ${periode}"`, "", headers.join(',')];
        processedData.forEach(row => { csvRows.push(headers.map(h => `"${String(row[h] == null ? "" : row[h]).replace(/"/g, '""')}"`).join(',')); });
        const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Laporan_SDM_PKH_${filterKabupaten}.csv`; link.click();
      };

      if (loading) return null;

      return (
        <div className="flex flex-col h-full w-full mx-auto relative md:p-4 p-2 bg-[#020617]">
          {/* MODAL REKAP */}
          {isRekapOpen && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/90 backdrop-blur-md p-2 md:p-4">
              <div id="rekap-print-area" className="glass-panel w-full h-full md:h-auto md:max-w-6xl md:max-h-[90vh] rounded-xl flex flex-col modal-animate bg-[#0f172a]">
                <div className="p-4 border-b border-white/10 flex justify-between items-center bg-emerald-900/30 rounded-t-xl no-print">
                  <h2 className="text-xl font-black text-emerald-400">REKAPITULASI 13 KABUPATEN</h2>
                  <div className="flex gap-2"><button onClick={() => window.print()} className="bg-rose-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow">PDF</button><button onClick={() => setIsRekapOpen(false)} className="bg-slate-800 text-white px-3 py-2 rounded-lg">Tutup</button></div>
                </div>
                <div className="flex-1 overflow-auto custom-scrollbar p-2 md:p-4 bg-white md:bg-transparent">
                  <table className="w-full text-left border-collapse min-w-max text-black md:text-white text-xs md:text-sm">
                    <thead className="bg-slate-200 md:bg-[#0b0f19] sticky top-0 border-b border-slate-700">
                      <tr><th className="px-4 py-3">Kabupaten</th><th className="px-4 py-3 text-center">SDM</th>{rekapMetrics.map(m => <th key={m} className="px-4 py-3 text-center">{m}</th>)}</tr>
                    </thead>
                    <tbody className="divide-y divide-slate-300 md:divide-slate-800">
                      {dataRekap13Kab.map(kab => (
                        <tr key={kab.name}><td className="px-4 py-3 font-bold">{kab.name}</td><td className="px-4 py-3 text-center font-black text-emerald-600 md:text-emerald-400 bg-emerald-50 md:bg-emerald-900/10">{kab.totalSDM}</td>{rekapMetrics.map(m => <td key={m} className="px-4 py-3 text-center">{kab[m]}</td>)}</tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* MODAL EDIT */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-2 no-print">
              <div className="glass-panel w-full max-w-4xl max-h-[95vh] rounded-xl flex flex-col bg-[#0f172a]">
                <div className="p-4 border-b border-white/10 flex justify-between items-center bg-indigo-900/40 rounded-t-xl">
                  <h2 className="text-lg font-bold text-indigo-300">Edit Data</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 text-2xl px-2">&times;</button>
                </div>
                <form onSubmit={handleSaveEdit} className="p-4 overflow-auto custom-scrollbar flex-1 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    {tableHeaders.map(header => {
                      const d = (header.toUpperCase() === "NAMA") || (!isAdmin && !komponenKPM.includes(header.toUpperCase()));
                      return (
                        <div key={header} className="flex flex-col space-y-1">
                          <label className="text-[10px] font-semibold text-slate-400 uppercase">{header}</label>
                          <input type="text" value={editFormData[header] || ""} onChange={(e) => setEditFormData({...editFormData, [header]: e.target.value})} disabled={d} className={`w-full px-3 py-2 rounded-lg text-xs border ${d ? "bg-slate-800 text-slate-500" : "bg-slate-900 text-white"}`} />
                        </div>
                      )
                    })}
                    <div className="col-span-full mt-4 flex justify-end gap-2"><button type="submit" className="bg-indigo-600 px-6 py-2 rounded-lg font-bold text-white shadow-lg">SIMPAN</button></div>
                </form>
              </div>
            </div>
          )}

          {/* HEADER */}
          <div className="glass-panel rounded-xl p-3 md:p-4 mb-2 shrink-0 flex flex-col md:flex-row justify-between items-center gap-3 no-print">
            <h1 className="text-sm md:text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 uppercase tracking-tighter text-center">DATABASE KOMPONEN PKH KALIMANTAN SELATAN</h1>
            <div className="flex gap-2 overflow-x-auto custom-scrollbar w-full md:w-auto px-1">
              {listKabupaten.map(kab => <button key={kab} onClick={() => setFilterKabupaten(kab)} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold border transition-all ${filterKabupaten === kab ? 'bg-indigo-600 border-indigo-400 text-white shadow' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>{kab}</button>)}
            </div>
          </div>

          {/* ACTION BAR */}
          <div className="glass-panel rounded-xl p-2 md:p-3 mb-2 shrink-0 flex flex-col md:flex-row gap-2 items-center justify-between no-print">
            <input type="text" placeholder="🔍 Cari Nama..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full md:w-1/3 bg-slate-900 border border-slate-600 text-white text-xs px-4 py-2 rounded-lg focus:outline-none" />
            <div className="flex gap-2 items-center w-full md:w-auto justify-between overflow-x-auto pb-1">
              <select value={itemsPerPage} onChange={(e) => setItemsPerPage(Number(e.target.value))} className="bg-slate-900 text-slate-300 text-[10px] rounded px-2 py-1.5 border border-slate-700"><option value={10}>10 Baris</option><option value={30}>30 Baris</option><option value={50}>50 Baris</option></select>
              <div className="flex items-center gap-1 bg-slate-900 rounded p-1 border border-slate-700">
                <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} className="px-2 py-1 bg-slate-800 text-white rounded text-[10px]">◀</button>
                <span className="text-[10px] font-bold px-1 text-indigo-300 whitespace-nowrap">Hal {currentPage} / {totalPages}</span>
                <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} className="px-2 py-1 bg-slate-800 text-white rounded text-[10px]">▶</button>
              </div>
              <button onClick={() => setIsRekapOpen(true)} className="hidden md:block bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded text-xs font-black shadow transition">REKAP</button>
              <button onClick={exportToCSV} className="hidden md:block bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded text-xs font-bold shadow transition">LAPORAN CSV</button>
            </div>
          </div>

          {/* TABLE */}
          <div className="flex-1 glass-panel rounded-xl overflow-hidden flex flex-col relative border border-slate-700 mb-16 md:mb-0 no-print">
            <div className="overflow-auto custom-scrollbar flex-1 relative w-full h-full">
              <table className="w-full min-w-[1200px] text-[11px] text-left border-collapse">
                <thead className="uppercase text-slate-400 bg-[#0b0f19] sticky top-0 z-20 shadow-md">
                  <tr><th className="px-3 py-3 sticky-header-col text-center w-24 border-b border-slate-700">Aksi</th>{tableHeaders.map((h) => <th key={h} onClick={() => handleSort(h)} className="px-3 py-3 font-bold cursor-pointer border-b border-slate-700 whitespace-nowrap hover:bg-slate-800 transition">{h}</th>)}</tr>
                </thead>
                <tbody className="divide-y divide-slate-700/50">
                  {paginatedData.map((row, idx) => (
                    <tr key={idx} className="table-row-hover bg-[#020617]/30">
                      <td className="px-2 py-2 sticky-col text-center shadow-[2px_0_5px_rgba(0,0,0,0.3)]"><button onClick={() => openEditModal(row)} className="bg-indigo-600 px-2 py-1 rounded text-[9px] font-bold mr-1 hover:bg-indigo-500 transition">UBAH</button>{isAdmin && <button onClick={() => handleDelete(row['KABUPATEN/KOTA'], row['NAMA'])} className="bg-red-600 px-2 py-1 rounded text-[9px] font-bold hover:bg-red-500 transition">HAPUS</button>}</td>
                      {tableHeaders.map(h => <td key={h} className="px-3 py-2 text-slate-300 whitespace-nowrap">{row[h] || "-"}</td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* MOBILE BOTTOM BAR */}
          <div className="md:hidden fixed bottom-0 left-0 w-full glass-panel border-t border-slate-600 p-3 flex gap-2 z-50 bg-[#0f172a]/95">
            <button onClick={() => setIsRekapOpen(true)} className="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg text-[11px] font-black shadow-lg">📊 REKAP 13 KABUPATEN</button>
            <button onClick={exportToCSV} className="flex-[0.5] bg-indigo-600 text-white py-2.5 rounded-lg text-[11px] font-bold shadow-lg text-center">LAPORAN</button>
          </div>
          <div className="md:hidden fixed bottom-14 right-4 z-50"><button onClick={handleLoginAdmin} className="bg-slate-800 border border-slate-600 text-white p-2 rounded-full text-[10px] shadow-xl">{isAdmin ? '🔓' : '🔒'}</button></div>
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
